        const input = document.getElementById('search-input');
        if (input) {
          input.focus();
          input.setSelectionRange(input.value.length, input.value.length);
        }
      }
    }

    function renderTabContent() {
      if (state.activeTab === 'comparador') return renderComparador();
      if (state.activeTab === 'factcheck') return renderFactCheck();

      if (state.activeTab === 'duelo') return renderDuelo();
      if (state.activeTab === 'simulador') return renderSimulador();
      if (state.activeTab === 'test') return renderTest();

    // ==================== MÓDULO 1: COMPARADOR POR TEMAS ====================
    function renderComparador() {
      const q = state.searchQuery.trim().toLowerCase();
      let groups = [];

      if (!q) {
        groups = TOPICS.filter((t) => t.id === state.selectedTopic).map((topic) => ({
          topic,
          entries: PARTIES.filter((p) => state.visibleParties.includes(p.id)).map((party) => ({
            party,
            data: PROGRAMS[topic.id][party.id],
          })),
        }));
      } else {
        groups = TOPICS.map((topic) => {
          const entries = PARTIES.filter((p) => state.visibleParties.includes(p.id))
            .map((party) => ({
              party,
              data: PROGRAMS[topic.id][party.id],

            .filter(
              ({ party, data }) =>
                party.name.toLowerCase().includes(q) ||
                party.fullName.toLowerCase().includes(q) ||
                party.leader.toLowerCase().includes(q) ||
                data.headline.toLowerCase().includes(q) ||
                data.tag.toLowerCase().includes(q) ||

    // ==================== MÓDULO 4: DUELO CARA A CARA ====================

                    </option>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-6 pt-6 border-t border-slate-100">
              <div class="bg-emerald-50/70 border border-emerald-200 rounded-xl p-4">

                  `).join('')}

              <div class="bg-rose-50/70 border border-rose-200 rounded-xl p-4">

                  `).join('')}

              </div>
            </div>
          </div>

          <div class="space-y-4">
            ${TOPICS.map((topic) => {
              const dataA = PROGRAMS[topic.id][state.duelA];
              const dataB = PROGRAMS[topic.id][state.duelB];

    // ==================== MÓDULO 5: SIMULADOR CIUDADANO (CON NIVEL DE RENTA) ====================
    function renderSimulador() {
      const { age, housing, work, income, family, territory } = state.profile;

      function getIncomeTaxImpact(pId, incomeBracket) {
        if (incomeBracket === 'menos27k') {
          if (pId === 'pp') return 'Deflactación del IRPF para rentas medias/bajas y actualización automática de mínimos personales al SMI.';
          if (pId === 'psoe') return 'Sin subidas de IRPF laboral; refuerzo de deducciones familiares y SMI por encima del 60% del salario medio.';
          if (pId === 'vox') return 'Bajada general de IRPF según número de hijos y rebaja de IVA en bienes esenciales.';
          if (pId === 'frente') return 'Bajada directa del IRPF para rentas del trabajo por debajo de 27.000 € e IVA progresivo en la luz.';
          if (pId === 'podemos') return 'Rebaja del tipo mínimo estatal del IRPF (del 9,5% al 9%) para aliviar los salarios más bajos.';
          if (pId === 'bng') return 'Alivio fiscal para rentas bajas, Tarifa Eléctrica Galega y gratuidad de peajes AP-9/AP-53.';
          return 'Deducciones autonómicas propias (tarifas forales en Euskadi/Navarra y REF en Canarias).';
        }
        if (incomeBracket === '27k_60k') {
          if (pId === 'pp') return 'Deflactación de tramos del IRPF para evitar pagar más por la inflación; sin subidas al ahorro.';
          if (pId === 'psoe') return 'Sin subida en el IRPF salarial; tipos del ahorro intactos hasta 50.000 € (19%-21%).';
          if (pId === 'vox') return 'Reducción de tramos del IRPF y mayores deducciones familiares en todo el espectro salarial.';
          if (pId === 'frente') return 'Sin subida de IRPF salarial en este tramo, pero elimina la deducción fiscal de planes de pensiones privados.';
          if (pId === 'podemos') return 'Mantiene la escala salarial hasta 60.000 €, pero equipara las rentas del capital al tipo del trabajo y elimina ventajas a planes privados.';
          if (pId === 'bng') return 'Mantenimiento de la carga salarial media con foco en recaudar más de grandes fortunas y corporaciones.';
          return 'Competencia autonómica sobre el tramo cedido del IRPF (PNV/Junts priorizan rebajas, ERC/Bildu progresividad).';
        }
        if (incomeBracket === '60k_120k') {
          if (pId === 'pp') return 'Sin subidas de impuestos: mantiene tipos actuales y apuesta por aliviar el IRPF para incentivar la inversión.';
          if (pId === 'psoe') return 'Sin subida directa al salario, pero si generas rentas del capital >50.000 € suben los tipos del ahorro (camino del 35% >300k).';
          if (pId === 'vox') return 'Bajada generalizada del IRPF y simplificación de tramos también en rentas medias-altas.';
          if (pId === 'frente') return 'Sin nuevo tramo salarial hasta 120.000 €, pero equipara los impuestos al capital/ahorro con el salario (hasta 47%) y suprime la Ley Beckham.';
          if (pId === 'podemos') return 'Subida de la mitad estatal del IRPF desde 60.000 € (23% entre 60k-99k y 24% entre 100k-199k, más tramo autonómico) y equiparación capital-trabajo.';
          if (pId === 'bng') return 'Mayor progresividad en los tramos altos del IRPF y destope de cotizaciones máximas a la Seguridad Social.';
          return 'ERC y EH Bildu apoyan mayor presión en tramos >60.000 €; PNV y Junts se oponen a subidas estatales.';
        }
        // mas120k
        if (pId === 'pp') return 'Sin subidas de IRPF, ahorro ni Patrimonio; defiende la seguridad jurídica y la atracción de capital e inversores.';
        if (pId === 'psoe') return 'Subida del impuesto a las rentas del capital >50.000 € escalando hasta un 35% >300.000 €, más gravamen a grandes fortunas y sueldos directivos.';
        if (pId === 'vox') return 'Recorte general de IRPF y Sociedades, y supresión de impuestos sobre el patrimonio y sucesiones.';
        if (pId === 'frente') return 'Nuevos tramos de IRPF desde 120.000 € (hasta el 52% >300.000 €), equiparación capital-trabajo, fin de la Ley Beckham y destope de cotizaciones.';
        if (pId === 'podemos') return 'IRPF estatal al 24%-28,5% (+ tramo autonómico), equiparación capital-trabajo, Patrimonio permanente y tipo marginal del 100% a herencias >10 millones.';
        if (pId === 'bng') return 'Aumento de la progresividad fiscal en rentas altas, destope de cotizaciones y tributación efectiva de grandes patrimonios en Galiza.';
        return 'Fuerte contraste territorial: ERC/EH Bildu impulsan impuestos a grandes fortunas; PNV/Junts rechazan la armonización estatal.';
      }

      const cards = PARTIES.map((party) => {
        const impacts = [];
        const pId = party.id;

        // 1. Nivel de Renta e Impuestos (NUEVO)
        const incomeLabel =
          income === 'menos27k' ? 'Impuestos (< 27.000 €)' :
          income === '27k_60k' ? 'Impuestos (27k - 60k €)' :
          income === '60k_120k' ? 'Impuestos (60k - 120k €)' :
          'Impuestos (> 120k € / Capital)';
        impacts.push({ area: incomeLabel, text: getIncomeTaxImpact(pId, income), highlight: true });

        // 2. Vivienda
        if (housing === 'alquiler') impacts.push({ area: 'Vivienda (Alquiler)', text: PROGRAMS.vivienda[pId].bullets[1] || PROGRAMS.vivienda[pId].bullets[0] });
        else if (housing === 'compra') impacts.push({ area: 'Vivienda (Compra)', text: PROGRAMS.vivienda[pId].bullets[0] });
        else impacts.push({ area: 'Vivienda (Propiedad)', text: PROGRAMS.vivienda[pId].bullets[2] });

        // 3. Trabajo / Jubilación
        if (age === 'jubilado') {
          impacts.push({ area: 'Pensiones y Jubilación', text: PROGRAMS.pensiones[pId].bullets[0] });
        } else if (work === 'autonomo') {
          impacts.push({
            area: 'Autónomos',
            text:
              pId === 'vox' ? 'Cuota de 0 euros si los ingresos no llegan al SMI y cuota progresiva desde 50 € por encima.' :
              pId === 'pp' ? 'Exención de cobrar y declarar el IVA si la facturación anual no supera los 85.000 euros.' :
              pId === 'bng' ? 'Cotización por ingresos reales adaptada al rural galego y Tarifa Eléctrica Galega para pymes.' :
              'Cotización por ingresos reales, deducción de gastos afectos y acceso a prestaciones de cese.',
          });
        } else {
          impacts.push({ area: 'Jornada y Empleo', text: PROGRAMS.economia[pId].bullets[0] });
        }

        // 4. Familia / Servicios
        if (family === 'con_hijos') {
          impacts.push({
            area: 'Familia y Conciliación',
            text:
              pId === 'pp' ? 'Gratuidad universal de educación infantil 0-3 años y actualización de mínimos familiares en IRPF.' :
              pId === 'frente' ? 'Remuneración al 100% de las 8 semanas de permiso parental para cuidado hasta los 8 años.' :
              pId === 'podemos' ? 'Prestación universal por crianza de 200 euros al mes por hijo hasta los 18 años.' :
              pId === 'vox' ? 'Reducción del IRPF en función del número de hijos y cheque escolar de libre elección.' :
              pId === 'bng' ? 'Gratuidad de libros de texto, refuerzo de escuelas infantiles públicas y plan de retorno joven.' :
              'Rebajas fiscales a familias con hijos, 4 semanas pagadas al 100% del permiso parental y edad mínima de 16 años en redes.',
          });
        } else {
          impacts.push({ area: 'Servicios Públicos', text: PROGRAMS.social[pId].bullets[0] });
        }

        // 5. Territorio
        if (territory === 'galicia') {
          impacts.push({
            area: 'Impacto en Galiza',
            text:
              pId === 'bng' ? 'Gratuidad total de AP-9 y AP-53, concierto económico gallego, cesión de pisos Sareb al IGVS y defensa de PAC/FEMPA.' :
              pId === 'psoe' ? 'Nuevo modelo de financiación (+21.000 M€), quita parcial de deuda autonómica y bonificaciones en la AP-9.' :
              pId === 'pp' ? 'Financiación autonómica multilateral con peso del envejecimiento y dispersión, e impulso al corredor noroeste.' :
              pId === 'frente' ? 'Financiación autonómica (+2,3% PIB), condonación de deuda contra el dumping fiscal y servicios a menos de 30 min.' :
              pId === 'podemos' ? 'Intervención pública de autopistas y eléctricas y moratoria a macroparques eólicos en suelo agrario.' :
              pId === 'vox' ? 'Centralización de competencias sanitarias y educativas y rebaja de impuestos en zonas despobladas.' :
              'Agenda centrada en sus respectivos territorios (Cataluña, Euskadi, Canarias) sin representación gallega.',
          });
        }

        return { party, impacts };
      });

      return `
        <div class="space-y-6">
          <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
            <h2 class="text-xl font-extrabold text-slate-900">¿Cómo te afectan los programas del 29-N?</h2>
            <p class="text-sm text-slate-500 mt-1 mb-6">
              Configura tu edad, vivienda, perfil laboral, <strong>tramo de renta anual</strong>, familia y territorio para ver el impacto directo en tu bolsillo.
            </p>

            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
              <!-- 1. Nivel de Renta (DESTACADO) -->
              <div class="bg-amber-50/70 p-3.5 rounded-xl border border-amber-200">
                <label class="block text-xs font-bold uppercase text-amber-900 mb-2">1. Nivel de Renta Anual (IRPF / Capital)</label>
                <div class="space-y-1.5">
                  ${[
                    { id: 'menos27k', label: 'Menos de 27.000 € / año' },
                    { id: '27k_60k', label: '27.000 € – 60.000 € (Media / Media-alta)' },
                    { id: '60k_120k', label: '60.000 € – 120.000 € / año' },
                    { id: 'mas120k', label: '> 120.000 € / Rentas del capital' },
                  ].map((opt) => `
                    <button
                      onclick="setProfile('income', '${opt.id}')"
                      class="w-full text-left px-3 py-2 rounded-lg text-xs font-semibold transition-colors ${
                        income === opt.id ? 'bg-slate-900 text-white' : 'bg-white text-slate-700 border border-amber-200 hover:bg-amber-100/50'
                      }"
                    >${opt.label}</button>
                  `).join('')}
                </div>
              </div>

              <!-- 2. Tramo de Edad -->
              <div class="bg-slate-50 p-3.5 rounded-xl border border-slate-200">
                <label class="block text-xs font-bold uppercase text-slate-500 mb-2">2. Tramo de Edad</label>
                <div class="space-y-1.5">
                  ${[
                    { id: 'joven', label: 'Menor de 35 años' },
                    { id: 'adulto', label: '35 a 64 años' },
                    { id: 'jubilado', label: '65 años o más / Pensionista' },
                  ].map((opt) => `
                    <button
                      onclick="setProfile('age', '${opt.id}')"
                      class="w-full text-left px-3 py-2 rounded-lg text-xs font-semibold transition-colors ${
                        age === opt.id ? 'bg-slate-900 text-white' : 'bg-white text-slate-700 border border-slate-200 hover:bg-slate-100'
                      }"
                    >${opt.label}</button>
                  `).join('')}
                </div>
              </div>

              <!-- 3. Situación de Vivienda -->
              <div class="bg-slate-50 p-3.5 rounded-xl border border-slate-200">
                <label class="block text-xs font-bold uppercase text-slate-500 mb-2">3. Situación de Vivienda</label>
                <div class="space-y-1.5">
                  ${[
                    { id: 'alquiler', label: 'Vivo de alquiler' },
                    { id: 'compra', label: 'Busco comprar primera vivienda' },
                    { id: 'propietario', label: 'Propietario / Arrendador' },
                  ].map((opt) => `
                    <button
                      onclick="setProfile('housing', '${opt.id}')"
                      class="w-full text-left px-3 py-2 rounded-lg text-xs font-semibold transition-colors ${
                        housing === opt.id ? 'bg-slate-900 text-white' : 'bg-white text-slate-700 border border-slate-200 hover:bg-slate-100'
                      }"
                    >${opt.label}</button>
                  `).join('')}
                </div>
              </div>

              <!-- 4. Perfil Laboral -->
              <div class="bg-slate-50 p-3.5 rounded-xl border border-slate-200">
                <label class="block text-xs font-bold uppercase text-slate-500 mb-2">4. Perfil Laboral</label>
                <div class="space-y-1.5">
                  ${[
                    { id: 'asalariado', label: 'Trabajador por cuenta ajena' },
                    { id: 'autonomo', label: 'Autónomo / Pyme' },
                    { id: 'estudiante', label: 'Estudiante / Opositor' },
                  ].map((opt) => `
                    <button
                      onclick="setProfile('work', '${opt.id}')"
                      class="w-full text-left px-3 py-2 rounded-lg text-xs font-semibold transition-colors ${
                        work === opt.id ? 'bg-slate-900 text-white' : 'bg-white text-slate-700 border border-slate-200 hover:bg-slate-100'
                      }"
                    >${opt.label}</button>
                  `).join('')}
                </div>
              </div>

              <!-- 5. Cargas Familiares -->
              <div class="bg-slate-50 p-3.5 rounded-xl border border-slate-200">
                <label class="block text-xs font-bold uppercase text-slate-500 mb-2">5. Cargas Familiares</label>
                <div class="space-y-1.5">
                  ${[
                    { id: 'sin_hijos', label: 'Sin hijos a cargo' },
                    { id: 'con_hijos', label: 'Con hijos / Dependientes' },
                  ].map((opt) => `
                    <button
                      onclick="setProfile('family', '${opt.id}')"
                      class="w-full text-left px-3 py-2 rounded-lg text-xs font-semibold transition-colors ${
                        family === opt.id ? 'bg-slate-900 text-white' : 'bg-white text-slate-700 border border-slate-200 hover:bg-slate-100'
                      }"
                    >${opt.label}</button>
                  `).join('')}
                </div>
              </div>

              <!-- 6. Vínculo Territorial -->
              <div class="bg-slate-50 p-3.5 rounded-xl border border-slate-200">
                <label class="block text-xs font-bold uppercase text-slate-500 mb-2">6. Vínculo Territorial</label>
                <div class="space-y-1.5">
                  ${[
                    { id: 'galicia', label: 'Resido o voto en Galiza' },
                    { id: 'general', label: 'Resto del Estado' },
                  ].map((opt) => `
                    <button
                      onclick="setProfile('territory', '${opt.id}')"
                      class="w-full text-left px-3 py-2 rounded-lg text-xs font-semibold transition-colors ${
                        territory === opt.id ? 'bg-slate-900 text-white' : 'bg-white text-slate-700 border border-slate-200 hover:bg-slate-100'
                      }"
                    >${opt.label}</button>
                  `).join('')}
                </div>
              </div>
            </div>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
            ${cards.map(({ party, impacts }) => `
              <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden flex flex-col">
                <div class="h-2 w-full" style="background-color: ${party.color}"></div>
                <div class="p-5 flex-1">
                  <div class="flex items-center justify-between mb-4">
                    <span class="px-2.5 py-1 rounded-md text-xs font-bold ${party.badge}">${party.name}</span>
                    <span class="text-xs text-slate-400 font-medium">${party.leader}</span>
                  </div>
                  <div class="space-y-3">
                    ${impacts.map((imp) => `
                      <div class="p-3 rounded-xl border ${imp.highlight ? 'bg-amber-50/70 border-amber-200' : 'bg-slate-50 border-slate-100'}">
                        <span class="text-[11px] font-bold uppercase tracking-wider block mb-1 ${imp.highlight ? 'text-amber-900' : 'text-slate-500'}">${imp.area}</span>
                        <p class="text-xs text-slate-800 leading-relaxed">${imp.text}</p>
                      </div>
                    `).join('')}
                  </div>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    // ==================== MÓDULO 6: TEST DE AFINIDAD ====================
    function renderTest() {
      const answeredIds = Object.keys(state.answers);
      let resultsHtml = '';

      if (answeredIds.length === 0) {
        resultsHtml = `
          <div class="py-10 text-center text-slate-400 text-sm border-2 border-dashed border-slate-200 rounded-xl p-4">
            Selecciona una respuesta en cualquiera de las preguntas para ver tu porcentaje de coincidencia en tiempo real.
          </div>
        `;
      } else {
        const scores = {};
        const maxPossible = {};
        PARTIES.forEach((p) => { scores[p.id] = 0; maxPossible[p.id] = 0; });

        answeredIds.forEach((qId) => {
          const question = QUIZ_QUESTIONS.find((q) => q.id === qId);
          const optIdx = state.answers[qId];
          if (!question || optIdx === undefined) return;
          const chosenOpt = question.options[optIdx];
          PARTIES.forEach((p) => {
            scores[p.id] += chosenOpt.weights[p.id] || 0;
            const maxInQ = Math.max(...question.options.map((o) => o.weights[p.id] || 0));
            maxPossible[p.id] += maxInQ > 0 ? maxInQ : 3;
          });
        });

        const sorted = PARTIES.map((p) => ({
          party: p,
          pct: maxPossible[p.id] > 0 ? Math.round((scores[p.id] / maxPossible[p.id]) * 100) : 0,
        })).sort((a, b) => b.pct - a.pct);

        resultsHtml = `
          <div class="space-y-4">
            ${sorted.map(({ party, pct }, index) => `
              <div class="space-y-1.5">
                <div class="flex items-center justify-between text-xs font-bold">
                  <span class="flex items-center gap-2 text-slate-800">
                    ${index === 0 ? '<span class="px-1.5 py-0.5 rounded bg-amber-100 text-amber-800 text-[10px]">#1</span>' : ''}
                    ${party.name}
                  </span>
                  <span class="text-slate-900">${pct}%</span>
                </div>
                <div class="w-full h-2.5 bg-slate-100 rounded-full overflow-hidden">
                  <div class="h-full rounded-full transition-all duration-500" style="width: ${pct}%; background-color: ${party.color};"></div>
                </div>
              </div>
            `).join('')}

            <div class="pt-4 mt-4 border-t border-slate-100 text-xs text-slate-500 leading-relaxed">
              <strong>Nota metodológica:</strong> Este índice pondera exclusivamente la coincidencia temática con los programas oficiales del 29-N (actualizados a 22 de noviembre de 2026).
            </div>
          </div>
        `;
      }

      return `
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
          <div class="lg:col-span-8 space-y-5">
            <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
              <div class="flex items-center justify-between mb-2">
                <h2 class="text-xl font-extrabold text-slate-900">Test de Afinidad Programática 29-N</h2>
                <span class="text-xs font-bold px-3 py-1 rounded-full bg-slate-100 text-slate-700">
                  ${answeredIds.length} / ${QUIZ_QUESTIONS.length} respondidas
                </span>
              </div>
              <p class="text-sm text-slate-500">
                Responde a los 8 dilemas reales de la campaña de noviembre de 2026 para calcular tu afinidad con cada candidatura.
              </p>
            </div>

            ${QUIZ_QUESTIONS.map((q, qIdx) => `
              <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                <div class="flex items-center gap-2 text-xs font-bold uppercase tracking-wider text-amber-600 mb-1">
                  <span>Pregunta ${qIdx + 1}</span>
                  <span>·</span>
                  <span>${q.topic}</span>
                </div>
                <h3 class="text-base font-bold text-slate-900 mb-4">${q.question}</h3>
                <div class="space-y-2.5">
                  ${q.options.map((opt, oIdx) => {
                    const selected = state.answers[q.id] === oIdx;
                    return `
                      <button
                        onclick="selectQuizOption('${q.id}', ${oIdx})"
                        class="w-full text-left p-3.5 rounded-xl border text-sm transition-all flex items-start gap-3 ${
                          selected
                            ? 'bg-slate-900 text-white border-slate-900 shadow-sm'
                            : 'bg-slate-50 text-slate-700 border-slate-200 hover:bg-slate-100'
                        }"
                      >
                        <span
                          class="w-5 h-5 rounded-full border flex items-center justify-center text-xs font-bold shrink-0 mt-0.5 ${
                            selected
                              ? 'bg-amber-400 border-amber-400 text-slate-950'
                              : 'border-slate-300 text-slate-400'
                          }"
                        >${String.fromCharCode(65 + oIdx)}</span>
                        <span class="leading-snug">${opt.label}</span>
                      </button>
                    `;
                  }).join('')}
                </div>
              </div>
            `).join('')}
          </div>

          <div class="lg:col-span-4 lg:sticky lg:top-6">
            <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
              <div class="flex items-center justify-between mb-4">
                <h3 class="font-extrabold text-slate-900">🧭 Tu Mapa de Afinidad</h3>
                ${answeredIds.length > 0 ? `
                  <button onclick="resetQuiz()" class="text-xs text-slate-400 hover:text-slate-700">↺ Reiniciar</button>
                ` : ''}
              </div>
              ${resultsHtml}
            </div>
          </div>
        </div>
      `;
    }

    // ==================== ACCIONES INTERACTIVAS ====================
    function setActiveTab(tabId) { state.activeTab = tabId; renderApp(); }
    function toggleBngCard() { state.showBngCard = !state.showBngCard; renderApp(); }
    function setFactCheckFilter(f) { state.factCheckFilter = f; renderApp(); }
    function togglePactParty(id) {
      state.pactParties = state.pactParties.includes(id)
        ? state.pactParties.filter((p) => p !== id)
        : [...state.pactParties, id];
      renderApp();
    }
    function handleSearchInput(val) {
      state.searchQuery = val;
      renderApp();
      const input = document.getElementById('search-input');
      if (input) {
        input.focus();
        input.setSelectionRange(val.length, val.length);
      }
    }
    function clearSearch() { state.searchQuery = ''; renderApp(); }
    function applyQuickSearch(tag) { state.searchQuery = tag; renderApp(); }
    function setViewMode(mode) { state.viewMode = mode; renderApp(); }
    function selectTopic(topicId) { state.selectedTopic = topicId; renderApp(); }
    function togglePartyVisibility(id) {
      if (state.visibleParties.includes(id)) {
        if (state.visibleParties.length > 1) {
          state.visibleParties = state.visibleParties.filter((p) => p !== id);
        }
      } else {
        state.visibleParties.push(id);
      }
      renderApp();
    }
    function showAllParties() { state.visibleParties = PARTIES.map((p) => p.id); renderApp(); }
    function setPensionSim(key, val) { state.pensionSim[key] = val; renderApp(); }
    function setDuel(side, val) { if (side === 'A') state.duelA = val; else state.duelB = val; renderApp(); }
    function swapDuel() { const t = state.duelA; state.duelA = state.duelB; state.duelB = t; renderApp(); }
    function setProfile(key, val) { state.profile[key] = val; renderApp(); }
    function selectQuizOption(qId, oIdx) { state.answers[qId] = oIdx; renderApp(); }
    function resetQuiz() { state.answers = {}; renderApp(); }

    document.addEventListener('DOMContentLoaded', renderApp);
  </script>
</body>
</html>
